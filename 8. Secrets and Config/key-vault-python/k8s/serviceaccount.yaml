apiVersion: v1
kind: ServiceAccount  # ServiceAccount: pod identity used by Azure Workload Identity
metadata:
  name: keyvault-client-sa
  labels:
    app: keyvault-client
  annotations:
    # Client ID of the user-assigned managed identity federated with this service account.
    # The identity needs the "Key Vault Secrets Officer" role on the vault.
    azure.workload.identity/client-id: "MANAGED_IDENTITY_CLIENT_ID"
